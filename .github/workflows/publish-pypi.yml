name: Build and publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Confirm publishing this commit to production PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  BFEE_DOCKING_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - name: Require production confirmation
        if: ${{ !inputs.confirm_publish }}
        run: |
          echo "Production PyPI publishing was not confirmed." >&2
          exit 1

      - uses: actions/checkout@v4

      - id: package-version
        name: Read package version
        shell: bash
        run: |
          version=$(python -c "from bfee_docking import __version__; print(__version__)")
          echo "Publishing bfee-docking $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: validate-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade build setuptools wheel

      - name: Build Windows wheel
        shell: pwsh
        run: ./scripts/build_windows_wheel.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-windows-${{ env.BFEE_DOCKING_BUILD_NUMBER }}
          path: dist/windows/*.whl
          if-no-files-found: error

  build-linux:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade build setuptools wheel

      - name: Build Linux wheel
        run: bash scripts/build_linux_wheel.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-linux-${{ env.BFEE_DOCKING_BUILD_NUMBER }}
          path: dist/linux/*.whl
          if-no-files-found: error

  publish-pypi:
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bfee-docking
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-wheel-*
          path: dist
          merge-multiple: true

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*.whl
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 2

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
